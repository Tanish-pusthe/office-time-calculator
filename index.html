<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Time Calculator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef3ff;
  margin: 0;
  padding: 20px;
}

h2 {
  text-align: center;
  color: #304ffe;
  margin-bottom: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 12px rgba(0,0,0,0.1);
}

textarea {
  width: 100%;
  height: 240px;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #bfc7ff;
  font-size: 14px;
  background: #f7f9ff;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  background: #304ffe;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #1e39d6;
}

#result {
  margin-top: 25px;
  padding: 15px;
  background: #e9edff;
  border-radius: 8px;
  font-size: 16px;
}

p {
  margin: 8px 0;
}
</style>
</head>

<body>

<h2>Office Time Calculator</h2>

<div class="container">
  <textarea id="logs" placeholder="Paste your punch logs here..."></textarea>
  <button onclick="processLogs()">Calculate</button>
  <div id="result"></div>
</div>

<script>
// Convert HH:MM:SS AM/PM → seconds
function toSeconds(t) {
  const [time, mod] = t.split(" ");
  let [h, m, s] = time.split(":").map(Number);
  if (mod === "PM" && h !== 12) h += 12;
  if (mod === "AM" && h === 12) h = 0;
  return h * 3600 + m * 60 + (s || 0);
}

// Seconds → 12h
function to12h(sec) {
  let h24 = Math.floor(sec / 3600) % 24;
  let m = Math.floor((sec % 3600) / 60);
  let s = sec % 60;
  const ap = h24 >= 12 ? "PM" : "AM";
  let h = h24 % 12 || 12;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")} ${ap}`;
}

// Seconds → hh mm ss
function formatHMS(sec) {
  let h = Math.floor(sec / 3600);
  let m = Math.floor((sec % 3600) / 60);
  let s = sec % 60;
  return `${String(h).padStart(2,"0")}h ${String(m).padStart(2,"0")}m ${String(s).padStart(2,"0")}s`;
}

// Seconds → mm:ss
function formatMS(sec) {
  let m = Math.floor(sec / 60);
  let s = sec % 60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function processLogs() {
  const text = document.getElementById("logs").value.trim();
  if (!text) return alert("Please paste logs");

  const lines = text.split(/\r?\n+/);
  let punches = [];
  let brk = 0;

  // Break calculation (unchanged)
  for (let line of lines) {
    const match = line.match(/(\d+)h\s*(\d+)m\s*(\d+)s/i);
    if (match) {
      brk += (+match[1] * 3600) + (+match[2] * 60) + (+match[3]);
    }
  }

  // Punch extraction — FIXED Late In handling
  for (let i = 0; i < lines.length - 1; i++) {
    if (lines[i].match(/AM|PM/)) {
      const time = lines[i].replace(/[^0-9: AMP]/g, "");

      // ❌ Ignore "Late in Punch In"
      if (
        lines[i + 1].includes("Punch In") &&
        !(lines[i + 2] && lines[i + 2].toLowerCase().includes("late"))
      ) {
        punches.push({ type: "IN", time });
      }

      if (lines[i + 1].includes("Punch Out")) {
        punches.push({ type: "OUT", time });
      }
    }
  }

  // Correct order (instead of reverse)
  punches.sort((a, b) => toSeconds(a.time) - toSeconds(b.time));

  let work = 0;

  // Work calculation (same logic)
  for (let i = 0; i < punches.length - 1; i++) {
    if (punches[i].type === "IN" && punches[i + 1].type === "OUT") {
      const diff = toSeconds(punches[i + 1].time) - toSeconds(punches[i].time);
      if (diff > 0) work += diff;
    }
  }

  const REQUIRED = 8 * 3600;
  const remainingWork = Math.max(REQUIRED - work, 0);

  const lastIn = punches.filter(p => p.type === "IN").pop();
  const expected = toSeconds(lastIn.time) + remainingWork;

  document.getElementById("result").innerHTML = `
    <p><strong>Break Taken:</strong> ${formatHMS(brk)}</p>
    <p><strong>Expected Punch Out:</strong> ${to12h(expected)}</p>
  `;
}
</script>

</body>
</html>
